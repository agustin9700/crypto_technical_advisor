name: CI

on:
  push:
  pull_request:

jobs:
  smoke-tests:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Deploy readiness check
        run: python check_deploy_ready.py

      - name: Pipeline smoke tests
        run: python tests_pipeline_smoke.py

      - name: Futures smoke tests
        run: python tests_futures_smoke.py
